# hyprlock.conf
# docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# rendered text supports pango markup (<b>, <i>, <span ...>). <br> = linebreak.
# clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

#  ─────────────────────────────────────────────────────────────
#  Theme  —  colors mirrored from ~/.config/hypr/scheme/current.lua
#  (Material-You dark, lavender primary). Re-sync these 6 if the
#  palette changes.
#  ─────────────────────────────────────────────────────────────
$primary   = rgb(c2c1ff)   # lavender accent
$accent2   = rgb(f5b2e0)   # pink  (tertiary)
$text      = rgb(e5e1e7)   # onSurface
$subtext   = rgb(c8c5d1)   # onSurfaceVariant
$muted     = rgb(918f9a)   # outline
$surface   = rgb(1c1b1f)   # surfaceContainerLow
$errorCol  = rgb(ffb4ab)

$font    = JetBrainsMono Nerd Font
$fontAlt = FantasqueSansM Nerd Font Mono

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 1000
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = fade,   0.33, 0, 0.2, 1

    # speed is in deciseconds (1 = 100ms). the previous ease-out curve
    # front-loaded the opacity, which is why the lock looked instant.
    animation = fadeIn,            1, 8, fade
    animation = fadeOut,           1, 5, fade
    animation = inputFieldDots,    1, 2, linear
    animation = inputFieldColors,  1, 3, linear
    animation = inputFieldWidth,   1, 2.5, fade
}

# ── Background ────────────────────────────────────────────────
background {
    monitor =
    path = screenshot
    color = $surface

    blur_passes = 3
    blur_size = 5
    noise = 0.011
    contrast = 0.95
    brightness = 0.6
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# ── Time ─────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME12
    color = $text
    font_size = 58
    font_family = $font

    position = 0, 31%
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.1
}

# ── Date ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtext
    font_size = 24
    font_family = $fontAlt

    position = 0, 21%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Avatar ───────────────────────────────────────────────────
image {
    monitor =
    path = ~/.config/waybar/assets/avatar.png
    size = 180
    rounding = -1          # circle
    border_size = 2
    border_color = $primary $accent2 45deg

    position = 0, 5%
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 7
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Name (below avatar) ──────────────────────────────────────
label {
    monitor =
    text = $DESC
    color = $subtext
    font_size = 17
    font_family = $fontAlt

    position = 0, -10%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Input field ──────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 52
    rounding = 14
    outline_thickness = 2

    inner_color = rgba(28, 27, 31, 0.45)
    font_color = $text
    font_family = $fontAlt

    outer_color = $primary $accent2 45deg
    check_color = $primary rgb(9dceff) 120deg
    fail_color  = $errorCol rgb(93000a) 40deg
    capslock_color = $accent2 rgb(bb7da9) 45deg

    dots_size = 0.24
    dots_spacing = 0.32
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <i>󰌾  Enter password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    check_text = <i>Unlocking…</i>

    position = 0, -17%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Lockout countdown (pam_faillock) ─────────────────────────
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/hyprlock/lockout-status.sh
    color = $errorCol
    font_size = 13
    font_family = $fontAlt

    position = 0, -25%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Caps Lock hint ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:250] sh -c 'grep -qxm1 1 /sys/class/leds/input*::capslock/brightness 2>/dev/null && echo "󰪛  Caps Lock is on" || true'
    color = $accent2
    font_size = 12
    font_family = $fontAlt

    position = 0, -31%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

#  ─────────────────────────────────────────────────────────────
#  Music  (structure unchanged — only card styling retouched)
#  ─────────────────────────────────────────────────────────────

# Card
shape {
    monitor =
    color = rgba(26, 25, 33, 0.82)

    rounding = 15
    position = 0, -45%
    size = 27%, 60

    zindex = 0

    border_size = 1
    border_color = rgba(150, 148, 160, 0.5)

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.45)
}

# Now playing
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock/music-status.sh
    color = $text
    font_size = 13
    font_family = $fontAlt
    zindex = 1

    position = 48, -45%
    halign = center
    valign = center
}

# Previous
shape {
    monitor =
    color = rgba(0, 0, 0, 0)
    rounding = 20
    position = -12.1%, -45%
    size = 25, 25
    zindex = 1
    onclick = playerctl previous
}
label {
    text =
    color = $subtext
    font_size = 13
    font_family = $font
    zindex = 1
    position = -12.1%, -45%
}

# Play / Pause
shape {
    monitor =
    color = rgba(0, 0, 0, 0)
    rounding = 20
    position = -10.6%, -45%
    size = 25, 25
    zindex = 1
    onclick = playerctl play-pause
}
label {
    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock/player-icon.sh
    color = $primary
    font_size = 12
    font_family = $font
    zindex = 1
    position = -10.6%, -45%
}

# Next
shape {
    monitor =
    color = rgba(0, 0, 0, 0)
    rounding = 20
    position = -9.1%, -45%
    size = 25, 25
    zindex = 1
    onclick = playerctl next
}
label {
    text =
    color = $subtext
    font_size = 13
    font_family = $font
    zindex = 1
    position = -9.1%, -45%
}

# ── Battery (top-right, as before) ───────────────────────────
label {
    monitor =
    text = cmd[update:20000] ~/.config/hypr/scripts/battery-status.sh
    color = $text
    font_size = 15
    font_family = $font

    position = 47.8%, 48.5%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
}
